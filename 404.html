<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>404 · Page Not Found · LexCertify</title>
  <link rel="icon" type="image/jpeg" href="images/hero 2.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #ffffff;
      --text-primary: #0f2440;
      --text-secondary: #4a6285;
      --accent: #1e4d8c;
      --accent-dark: #0f2440;
      --highlight: #c9a227;
      --transition: 0.3s ease;
    }

    [data-theme="dark"] {
      --bg-primary: #000000;
      --text-primary: #e6eef8;
      --text-secondary: #9db4d0;
    }

    [dir="rtl"] { text-align: right; }

    html, body {
      height: 100%;
      overflow: hidden; /* 🚫 no scroll */
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background var(--transition), color var(--transition);
    }

    /* ===================================================== */
    /* ===== 404 SECTION — fills viewport, centered ====== */
    /* ===================================================== */
    .error-section {
      width: 100%;
      height: 100vh;
      height: 100dvh; /* mobile-safe: dynamic viewport */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
      transition: background var(--transition);
    }
    .error-section::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(30, 77, 140, 0.05), transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(201, 162, 39, 0.06), transparent 45%);
      pointer-events: none;
    }
    .error-inner {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 720px;
      margin: 0 auto;
    }

    .error-code {
      font-size: clamp(5rem, 18vw, 12rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.06em;
      margin-bottom: clamp(0.8rem, 2vw, 1.5rem);
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 0;
    }
    .error-code .four {
      color: var(--text-primary);
      display: inline-block;
      transition: color 0.3s ease;
    }
    .error-code .zero {
      color: var(--highlight);
      display: inline-block;
      position: relative;
    }
    .error-code .zero::after {
      content: '';
      position: absolute;
      inset: 12% 22%;
      border-radius: 50%;
      background: transparent;
      box-shadow: 0 0 60px rgba(201, 162, 39, 0.35);
      pointer-events: none;
      z-index: -1;
    }

    .error-title {
      font-size: clamp(1.3rem, 4vw, 2.4rem);
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: clamp(0.8rem, 1.5vw, 1.2rem);
      letter-spacing: -0.5px;
      line-height: 1.15;
    }
    .error-title span { color: var(--highlight); }

    .error-desc {
      font-size: clamp(0.82rem, 1.6vw, 1.02rem);
      color: var(--text-secondary);
      line-height: 1.75;
      max-width: 560px;
      margin: 0 auto clamp(1.4rem, 3vw, 2.4rem);
    }

    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: clamp(0.7rem, 1.5vw, 0.95rem) clamp(1.7rem, 3vw, 2.4rem);
      border-radius: 60px;
      font-weight: 700;
      font-size: clamp(0.82rem, 1.4vw, 0.95rem);
      cursor: pointer;
      transition: 0.28s;
      text-decoration: none;
      box-shadow: 0 10px 26px rgba(30, 77, 140, 0.35);
      letter-spacing: 0.3px;
    }
    .error-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-3px);
      box-shadow: 0 16px 38px rgba(30, 77, 140, 0.5);
    }
    .error-btn i { color: #ffffff; }
  </style>
</head>
<body>

  <!-- ============================================ -->
  <!-- ===== 404 SECTION ========================= -->
  <!-- ============================================ -->
  <section class="error-section">
    <div class="error-inner">
      <div class="error-code">
        <span class="four">4</span><span class="zero">0</span><span class="four">4</span>
      </div>
      <h1 class="error-title">
        This Page <span>Drifted Off The Record</span>
      </h1>
      <p class="error-desc">
        Oops! The page you're looking for doesn't exist anymore — or may have been moved to a new section. Let's get you back to something worth certifying.
      </p>
      <a href="index.html" class="error-btn">
        <i class="fas fa-arrow-left"></i> Back To Home
      </a>
    </div>
  </section>

</body>
</html>
